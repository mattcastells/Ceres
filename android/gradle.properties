org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 trae su propio DSL y Kotlin integrado; los plugins de Flutter todavía
# esperan el modelo anterior. Son las mismas banderas que pone la plantilla de
# `flutter create`.
android.newDsl=false
android.builtInKotlin=false

# El proyecto vive en D: y el caché de paquetes de pub en C:. El compilador
# incremental de Kotlin no tolera esa mezcla de raíces en Windows y corta el
# build de los plugins con "this and base files have different roots".
# Apagarlo cuesta unos segundos por build y evita el problema por completo.
kotlin.incremental=false
