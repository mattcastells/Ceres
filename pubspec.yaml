name: ceres
description: "Ceres — registro de alimentación, actividad física y peso corporal."
publish_to: 'none'
# El build number (lo que va después del `+`) es el versionCode de Android y
# **solo puede crecer**: si baja, el teléfono se niega a instalar encima.
#
# Arranca en 5000 y no en 12 porque las versiones 1.3.0 y 1.3.1 publicaron
# APK por arquitectura con el corrimiento de Flutter, y el más alto que quedó
# instalado fue 4011 (x86_64). Cualquier número por debajo de eso deja a esa
# gente sin poder actualizar nunca más desde la app.
version: 1.23.1+5037

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado (13-state-management.md §1)
  flutter_riverpod: ^3.5.0

  # Navegación (02-information-architecture.md)
  go_router: ^18.1.4


  # Utilidades
  intl: ^0.20.3
  uuid: ^4.6.0
  # Para volver a codificar a JPEG la foto que `image_picker` devolvió en PNG.
  # Ver `data/local/photo_normalizer.dart`: es un caso raro y caro.
  image: ^4.13.1
  collection: ^1.19.1
  # SHA-256 del APK descargado contra el digest que publica GitHub
  # (`data/remote/github_releases_client.dart`). Ya venía como transitiva; se
  # declara porque ahora se importa directo.
  crypto: ^3.0.8
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  http: ^1.6.0
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2

  supabase_flutter: ^2.18.3
  mobile_scanner: ^7.5.0
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  speech_to_text: ^7.5.0
  pdf: ^3.13.1
  # Abrir los videos de los artículos en YouTube.
  url_launcher: ^6.3.3
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Ícono adaptativo de Android a partir de assets/brand/ (ver `BrandMark`).
# Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: ic_launcher
  ios: false
  image_path: assets/brand/icon-512.png
  adaptive_icon_background: assets/brand/adaptive-background.png
  adaptive_icon_foreground: assets/brand/adaptive-foreground.png
  adaptive_icon_monochrome: assets/brand/monochrome.png
  # El mismo que `android/app/build.gradle.kts`; tenerlos distintos hacía que
  # el generador de íconos creara variantes para una API que la app ya no
  # soporta.
  min_sdk_android: 26

flutter:
  uses-material-design: true

  # `assets/brand/` no va al bundle: la app no lo carga, y el generador de
  # íconos de arriba lo lee del disco. Empaquetarlo sumaba al APK cinco PNG
  # —uno con el nombre viejo de la app— que nada mostraba.
  assets:
    - assets/mock/
    # Tabla de composición de alimentos argentinos (ARGENFOODS, UNLu).
    - assets/data/

  # Familia única: Inter (06-design-tokens.md §2).
  # Peso de títulos 500 — no se sube a 600/700.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

    # Iconografía del sistema de diseño (06-design-tokens.md §4). La usa
    # lib/core/utils/phosphor_icons.dart.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
